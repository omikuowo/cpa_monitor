name = "cpa-monitor"
main = "src/index.js"
compatibility_date = "2026-05-03"

# 前端静态文件。/api/* 不对应任何静态文件，会自动交给 Worker 处理。
[assets]
directory = "./public"
binding = "ASSETS"

# 所有配置（管理员密码、CPA 实例、检测参数）都在网页里填写并保存在这个 KV 中。
# 不需要手动创建：一键部署 / wrangler deploy 会自动创建并绑定 KV namespace。
[[kv_namespaces]]
binding = "CPA_MONITOR_KV"

# 定时检测：每 5 分钟唤醒一次，实际间隔在网页「设置 → 检测」中配置（0 = 关闭）。
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
